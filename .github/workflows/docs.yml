# The versioned docs site, at https://wandcli.com.
#
# The root is the latest build. https://wandcli.com/ is the homepage and
# https://wandcli.com/docs/ the current documentation; every released version
# also keeps a frozen copy at /vX.Y.Z/ forever, so a repo pinned to wand
# vX.Y.Z can read the doctrine matching its covenant schema. /latest/ is the
# same build as the root, published a second time so links that predate this
# layout — and the version picker's own "latest" option — keep resolving.
#
# "Latest" therefore means main, not the last release: the homepage has to be
# editable without cutting a release, and this repo's rule is already that
# docs change with the code in the same PR. So push-to-main republishes the
# root and /latest/; a tag additionally freezes /vX.Y.Z/ and appends to the
# manifest; workflow_dispatch republishes the root and /latest/ by hand.
#
# One-time setup, already done: GitHub Pages serves the gh-pages branch
# (Settings → Pages), with wandcli.com as the verified custom domain and
# DNS A records pointing at GitHub's Pages addresses.
name: Docs

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"

# Pin the same Hugo everywhere: the standard (non-extended) build is enough
# because the theme is plain CSS, but a version drifting between local and CI
# is how a site that "built fine yesterday" breaks on release day.
env:
  HUGO_VERSION: "0.165.0"

permissions:
  contents: read

jobs:
  # PRs touching the site prove it still builds; nothing is deployed.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
      - name: Build
        run: hugo --source docs --destination "$PWD/public"

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}

      # Every emitted link is relative (see docs/hugo.toml), so no baseURL is
      # passed: the same pages serve from any host and any directory, and only
      # the stamped version label differs between builds. The root goes first
      # because the version directories are staged inside it.
      - name: Build root
        run: hugo --source docs --destination "$PWD/public"
        env:
          HUGO_PARAMS_VERSION: latest

      # The same build again, for links written before the root was the site.
      - name: Build latest
        run: hugo --source docs --destination "$PWD/public/latest"
        env:
          HUGO_PARAMS_VERSION: latest

      # A tag additionally publishes the frozen copy this tag owns forever.
      - name: Build ${{ github.ref_name }}
        if: github.ref_type == 'tag'
        run: hugo --source docs --destination "$PWD/public/${{ github.ref_name }}"
        env:
          HUGO_PARAMS_VERSION: ${{ github.ref_name }}

      # The manifest feeding the version picker: append this tag to whatever
      # gh-pages already carries, unique, sorted newest first. The first
      # release finds no branch and starts from []. Non-tag runs skip this —
      # keep_files leaves the existing manifest in place.
      - name: Update versions.json
        if: github.ref_type == 'tag'
        run: |
          if git fetch origin gh-pages --depth=1 2>/dev/null; then
            git show FETCH_HEAD:versions.json > versions.json || echo "[]" > versions.json
          else
            echo "[]" > versions.json
          fi
          jq --arg v "${{ github.ref_name }}" \
            '. + [$v] | unique | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | reverse' \
            versions.json > public/versions.json
          cat public/versions.json

      # keep_files is the point: this deploy adds or overwrites only what it
      # staged — the root, /latest, and on tag builds /vX.Y.Z and
      # versions.json — while every previously released version's directory
      # stays frozen in place. cname re-asserts the custom-domain CNAME file
      # on every deploy so it can never be lost to a future non-keep deploy.
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
          cname: wandcli.com
