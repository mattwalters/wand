# goreleaser configuration — https://goreleaser.com
#
# Runs from .github/workflows/release.yml on every v*.*.* tag push. The
# stamped ldflags feed `wand version`; the var names must match
# internal/cli/version.go (there is a test holding the defaults in place).
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: .
    ldflags:
      - -s -w
      - -X github.com/mattwalters/wand/internal/cli.Version={{.Version}}
      - -X github.com/mattwalters/wand/internal/cli.Commit={{.Commit}}
      - -X github.com/mattwalters/wand/internal/cli.Date={{.Date}}

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{- if eq .Os "darwin" }}Darwin{{ else if eq .Os "linux" }}Linux{{ else if eq .Os "windows" }}Windows{{ else }}{{ .Os }}{{ end }}_{{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# Homebrew tap: deliberately deferred (WND-14). Prerequisites before adding a
# brews: block here:
#   1. A mattwalters/homebrew-wand repo.
#   2. A PAT with write access to it, stored as the HOMEBREW_TAP_GITHUB_TOKEN
#      secret and passed through in release.yml.
# Do not block releases on it.
