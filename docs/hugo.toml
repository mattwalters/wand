# The docs site. Built by .github/workflows/docs.yml: the root is the latest
# build (it tracks main), /latest/ is that same build published again for
# links that predate the layout, and every release tag freezes a copy under
# /vX.Y.Z. The baseURL below is only the local-preview default.
#
# The theme is hand-rolled in layouts/ on purpose: Docsy would drag a Node
# toolchain into a dependency-free Go repo, and a theme module is one more
# pinned dependency to justify. The site is a handful of Markdown pages; the
# layout earns its keep by being small enough to read.
# The baseURL is deliberately the bare domain, never a version subpath, and
# every emitted link is relative. Frozen version builds must survive a host
# or path move: the v0.1.0 build predated the wandcli.com migration and its
# baked path-absolute asset URLs 404'd until the copy was re-stamped by hand
# on gh-pages. Relative links make every build serve identically from any
# host and any directory. (Hugo's relativeURLs also mis-relativizes when the
# baseURL carries a subpath — a second reason the version dir stays out.)
baseURL = "https://wandcli.com/"
title = "wand"
relativeURLs = true

disableKinds = ["taxonomy", "term", "rss", "sitemap"]

[markup.highlight]
# Classes instead of inline styles: no chroma stylesheet is shipped, so code
# renders on the plain style.css block, which follows light/dark mode.
noClasses = false

[params]
# The version this build documents. CI sets HUGO_PARAMS_VERSION to the tag
# (or "latest"); "dev" means a local preview.
version = "dev"

# The sidebar is curated here, not derived from the page list: grouping and
# order are editorial decisions, and a docs site whose nav is alphabetical
# happenstance reads as unfinished. Every new content page gets an entry —
# an unlisted page is unreachable by design, not an accident.
#
# Every entry lives under /docs. The homepage is the splash and carries no
# rail; the documentation is one section beneath it, reached from the Docs
# link the header shows on every page.
[[menus.main]]
name = "Overview"
pageRef = "/docs"
weight = 10
[menus.main.params]
section = "Start"

[[menus.main]]
name = "The covenant"
pageRef = "/docs/covenant"
weight = 20
[menus.main.params]
section = "Doctrine"

# The command reference. Names are the command as typed, and each entry
# carries mono = true so the rail sets them in the face you type them in.
# Order is curated: setup, then the read layer, then the lifecycle verbs,
# then the two that need no Linear key. Alphabetical would scatter the
# verbs that are only meaningful as a sequence.
[[menus.main]]
name = "All commands"
pageRef = "/docs/commands"
weight = 100
[menus.main.params]
section = "Commands"

